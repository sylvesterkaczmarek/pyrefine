name: Validate four-dimensional SFE output

on:
  push:
    branches: [validation/sfe-fourth-axis-20260926]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out exact submitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/pyrefine
          ref: f93a67d43c0c86536615c323d1c32a535c79a42e
          path: source
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e ./source pytest pytest-cov build flake8 scipy pandas
      - name: Verify fixed and original implementations
        run: python validation/verify.py source
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ matrix.python }}
          path: evidence/
